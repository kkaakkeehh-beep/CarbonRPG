<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarbonRPG のテスト</title>
  <style>
    body { background: #0a0d1c; color: #eee; font-family: monospace; padding: 16px; }
    .ok { color: #7ee787; } .ng { color: #ff7b72; } pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>CarbonRPG のテスト</h1>
  <div id="out"></div>
  <script src="lib/smiles-drawer.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang/en-ui.js"></script>
  <script src="js/lang/en-story1.js"></script>
  <script src="js/lang/en-q1.js"></script>
  <script src="js/lang/en-story2.js"></script>
  <script src="js/lang/en-q2.js"></script>
  <script src="js/lang/en-story3.js"></script>
  <script src="js/lang/en-q3.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/story.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/mol.js"></script>
  <script src="js/dev.js"></script>
  <script>
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function check(label, cond, detail) {
      cond ? pass++ : fail++;
      out.insertAdjacentHTML('beforeend', `<div class="${cond ? 'ok' : 'ng'}">${cond ? '✔' : '✘'} ${label}${cond ? '' : `<pre>${detail}</pre>`}</div>`);
    }

    // ---- 問題データ ----
    const ids = new Set(), bad = [];
    for (const q of Questions.LIST) {
      if (ids.has(q.id)) bad.push(`${q.id}: id が重複`);
      ids.add(q.id);
      if (!Questions.DIFFS[q.diff]) bad.push(`${q.id}: diff が不正`);
      // 物語の中の決まった問題（special）は、選択肢が 2〜4 つでもよい。ボーカの問い（anyOk）は、選択肢ごとに返事がある
      const nc = q.choices.length;
      if (q.special ? (nc < 2 || nc > 4 || new Set(q.choices).size !== nc) : (nc !== 4 || new Set(q.choices).size !== 4)) bad.push(`${q.id}: 選択肢の数か重複`);
      if (q.anyOk && !(q.replies && q.replies.length === nc)) bad.push(`${q.id}: 選択肢ごとの返事がない`);
      if (!(q.a >= 0 && q.a < q.choices.length)) bad.push(`${q.id}: 正解の添字が範囲外`);
      if (!q.explain && !q.anyOk) bad.push(`${q.id}: 解説がない`);
    }
    check(`問題データの形式（${Questions.LIST.length} 問）`, !bad.length, bad.join('\n'));
    for (const ch of [1, 2, 3, 4, 5]) for (let d = 1; d <= 4; d++) {
      const n = Questions.pickSet(ch, d).filter(q => !q.special).length;
      check(`第${ch}章・${Questions.DIFFS[d].name}: 20 問以上（${n} 問）`, n >= 20, `${n} 問`);
    }
    // 第 2 章のボスが形態ごとに出せる問題があるか
    const tagBad = [];
    for (let d = 1; d <= 4; d++) for (const tag of ['keto', 'enol']) {
      const n = Questions.LIST.filter(q => q.ch === 2 && q.tag === tag && (q.diff === d || q.diff === Math.min(4, d + 1))).length;
      if (n < 4) tagBad.push(`難易度 ${d} の ${tag}: ${n} 問`);
    }
    check('第2章ボス: ケト形・エノール形の問題が各難易度に 4 問以上', !tagBad.length, tagBad.join('\n'));
    check('第2章の問題すべてに tag（keto / enol）', Questions.LIST.filter(q => q.ch === 2).every(q => ['keto', 'enol'].includes(q.tag)), '');
    // 第 3 章：ラジカル・芳香族の両方が各難易度にあり、ラジカの 3 段階それぞれに出せる問題がある
    check('第3章の問題すべてに tag（radical / arom）', Questions.LIST.filter(q => q.ch === 3).every(q => ['radical', 'arom'].includes(q.tag)), '');
    const c3Bad = [];
    for (let d = 1; d <= 4; d++) {
      const band = Questions.LIST.filter(q => q.ch === 3 && (q.diff === d || q.diff === Math.min(4, d + 1)));
      for (const tag of ['radical', 'arom']) { const n = band.filter(q => q.tag === tag).length; if (n < 8) c3Bad.push(`難易度 ${d} の ${tag}: ${n} 問`); }
      GameData.ENEMIES.radika.stages.forEach((st, i) => {
        const n = band.filter(q => q.tag === 'radical' && st.topics.includes(q.topic)).length;
        if (n < 2) c3Bad.push(`難易度 ${d} のラジカ第 ${i + 1} 段階: ${n} 問`);
      });
    }
    // 敵の得意分野（topics）が、実際にある分野名か
    const topicSet = new Set(Questions.LIST.map(q => q.topic));
    for (const [k, E] of Object.entries(GameData.ENEMIES)) for (const t of [...(E.topics || []), ...(E.stages || []).flatMap(s => s.topics || [])]) if (!topicSet.has(t)) c3Bad.push(`${k} の分野 ${t} の問題がない`);
    check('第3章: 分野・段階ごとの問題数と、敵の得意分野の名前', !c3Bad.length, c3Bad.join('\n'));
    // 第 4 章：ペリ環状・鏡の両方が各難易度にあり、アキラルの熱・光の段階それぞれに出せる問題がある
    check('第4章の問題すべてに tag（peri / mirror）', Questions.LIST.filter(q => q.ch === 4).every(q => ['peri', 'mirror'].includes(q.tag)), '');
    const c4Bad = [];
    for (let d = 1; d <= 4; d++) {
      const band = Questions.LIST.filter(q => q.ch === 4 && (q.diff === d || q.diff === Math.min(4, d + 1)));
      for (const tag of ['peri', 'mirror']) { const n = band.filter(q => q.tag === tag).length; if (n < 8) c4Bad.push(`難易度 ${d} の ${tag}: ${n} 問`); }
      GameData.ENEMIES.akiral.stages.forEach((st, i) => {
        const n = band.filter(q => q.tag === 'peri' && st.topics.includes(q.topic)).length;
        if (n < 2) c4Bad.push(`難易度 ${d} のアキラル第 ${i + 1} 段階: ${n} 問`);
      });
      const sh = GameData.ENEMIES.shadow.topics, nSh = band.filter(q => q.tag === 'mirror' && sh.includes(q.topic)).length;
      if (nSh < 6) c4Bad.push(`難易度 ${d} の影のカーボの分野: ${nSh} 問`);
    }
    check('第4章: 分野・段階ごとの問題数', !c4Bad.length, c4Bad.join('\n'));
    // 第 5 章：合成戦略・不斉合成の両方が各難易度にあり、ボーカの第 1 段階（合成戦略）に出せる問題がある
    check('第5章の問題すべてに tag（synth / asym）', Questions.LIST.filter(q => q.ch === 5 && !q.special).every(q => ['synth', 'asym'].includes(q.tag)), '');
    const c5Bad = [];
    for (let d = 1; d <= 4; d++) {
      const band = Questions.LIST.filter(q => q.ch === 5 && !q.special && (q.diff === d || q.diff === Math.min(4, d + 1)));
      for (const tag of ['synth', 'asym']) { const n = band.filter(q => q.tag === tag).length; if (n < 8) c5Bad.push(`難易度 ${d} の ${tag}: ${n} 問`); }
      const n1 = band.filter(q => q.tag === 'synth' && GameData.ENEMIES.boka.stages[0].topics.includes(q.topic)).length;
      if (n1 < 8) c5Bad.push(`難易度 ${d} のボーカ第 1 段階: ${n1} 問`);
    }
    // chs の '5:synth' のような書き方が、実際にある章と tag か
    for (const [k, E] of Object.entries(GameData.ENEMIES)) for (const c of E.chs || []) {
      if (typeof c === 'number' ? !Questions.LIST.some(q => q.ch === c) : !Questions.LIST.some(q => `${q.ch}:${q.tag}` === c && !q.special)) c5Bad.push(`${k} の chs ${c} の問題がない`);
    }
    check('第5章: 分野・段階ごとの問題数と、敵の出題範囲', !c5Bad.length, c5Bad.join('\n'));
    const smiBad = [];
    for (const q of Questions.LIST.filter(q => q.smiles)) {
      SmilesDrawer.parse(q.smiles, () => {}, () => smiBad.push(`${q.id}: ${q.smiles}`));
    }
    for (const q of Questions.LIST.filter(q => q.cs)) {
      if (q.cs.length !== 4) smiBad.push(`${q.id}: cs が 4 つではない`);
      if (q.cl && q.cl.length !== 4) smiBad.push(`${q.id}: cl が 4 つではない`);
      if (!q.cs[q.a]) smiBad.push(`${q.id}: 正解の選択肢に構造式がない`);
      q.cs.forEach((smi, i) => smi && SmilesDrawer.parse(smi, () => {}, () => smiBad.push(`${q.id} 選択肢${i}: ${smi}`)));
      if (new Set(q.cs.filter(Boolean)).size !== q.cs.filter(Boolean).length) smiBad.push(`${q.id}: 同じ構造式が重複`);
    }
    // 名前つきの構造式（問題文の mols、選択肢の cm）
    for (const q of Questions.LIST) {
      for (const m of q.mols || []) {
        if (!Array.isArray(m) || m.length !== 2 || !m[0]) smiBad.push(`${q.id}: mols の形が不正`);
        else SmilesDrawer.parse(m[1], () => {}, () => smiBad.push(`${q.id} mols ${m[0]}: ${m[1]}`));
      }
      if (q.cm) {
        if (q.cm.length !== 4) smiBad.push(`${q.id}: cm が 4 つではない`);
        if (q.cs) smiBad.push(`${q.id}: cs と cm を同時に使っている`);
        q.cm.forEach((smi, i) => smi && SmilesDrawer.parse(smi, () => {}, () => smiBad.push(`${q.id} cm${i}: ${smi}`)));
      }
    }
    check('問題の SMILES がすべて読める（構造式で答える問題・名前つきの構造式）', !smiBad.length, smiBad.join('\n'));
    check(`名前つきの構造式を添えた問題（${Questions.LIST.filter(q => q.mols || q.cm).length} 問）`, Questions.LIST.filter(q => q.mols || q.cm).length >= 130, '');
    // 立体の記号と SMILES の対応（本ゲームの骨格では X が CIP 1 位）
    const cfgOf = smi => smi.includes('[C@@H]') ? 'R' : smi.includes('[C@H]') ? 'S' : null;
    const stereoQs = { 'c1-1-01': 'R', 'c1-1-07': 'R', 'c1-2-07': 'R', 'c1-2-10': 'S', 'c1-3-09': 'R', 'c1-2-18': 'S' };
    const stBad = Object.entries(stereoQs).filter(([id, c]) => cfgOf(Questions.LIST.find(q => q.id === id).smiles) !== c);
    // 構造式の選択肢: 正解の SMILES の立体と問題の想定が合っているか
    const csStereo = { 'c1-1-07': 'S', 'c1-2-10': 'R', 'c1-1-21': 'S', 'c1-3-21': 'S' };
    for (const [id, c] of Object.entries(csStereo)) { const q = Questions.LIST.find(q => q.id === id); if (cfgOf(q.cs[q.a]) !== c) stBad.push([id, 'cs']); }
    check('問題文の立体と SMILES が一致', !stBad.length, JSON.stringify(stBad));

    // ---- マップと台本 ----
    const mapBad = [];
    const sceneIds = new Set(Object.keys(Story.SCENES));
    const flagsAll = { elder: true, sisters: true, duo: true, boss: true, f_entry: true, started: true,
      c2_met: true, c2_lens: true, c2_pier: true, c2_kidnap: true, c2_rescued: true, c2_clue2: true, c2_clue3: true, c2_chase: true, c2_reveal: true };
    // 第 3 章の進み具合（順番どおりに立つフラグ）
    const c3Order = ['c2_boss', 'ch3', 'c3_arrive', 'c3_gate', 'c3_king1', 'c3_radika1', 'c3_aniboy', 'c3_pyr', 'c3_duel1', 'c3_emblem', 'c3_ibu', 'c3_hint', 'c3_bmeso',
      'c3_octa', 'c3_mid', 'c3_king2', 'c3_tempo', 'c3_lastpillar', 'c3_tower', 'c3_top', 'c3_boss'];
    const c3Steps = c3Order.map((_, i) => Object.fromEntries(c3Order.slice(0, i + 1).map(k => [k, true])));
    // 第 4 章の進み具合
    const c4Order = ['clear3', 'ch4', 'c4_mount', 'c4_lake', 'c4_bull', 'c4_in', 'c4_kairo', 'c4_door1', 'c4_door2', 'c4_door3', 'c4_c2talk', 'c4_door4',
      'c4_mhall', 'c4_mh1', 'c4_mh2', 'c4_mh3', 'c4_shadow', 'c4_wed', 'c4_guards', 'c4_racem', 'c4_shatter', 'c4_boss'];
    const c4Steps = c4Order.map((_, i) => Object.fromEntries([...c3Order, ...c4Order.slice(0, i + 1)].map(k => [k, true])));
    // 第 5 章の進み具合
    const c5Order = ['clear4', 'ch5', 'c5_gesui', 'c5_boeki', 'c5_ambush', 'c5_confess', 'c5_bunEki', 'c5_d1', 'c5_d2', 'c5_d3', 'c5_d5',
      'c5_tppo', 'c5_cation', 'c5_star', 'c5_boss'];
    const c5Steps = c5Order.map((_, i) => Object.fromEntries([...c3Order, ...c4Order, ...c5Order.slice(0, i + 1)].map(k => [k, true])));
    const flagSets = [{}, flagsAll, { ...flagsAll, night: true }, { night: true }, { c2_lens: true }, { c2_clue2: true }, ...c3Steps, ...c4Steps, ...c5Steps];
    for (const [id, m] of Object.entries(Maps.MAPS)) {
      const W = m.grid[0].length;
      m.grid.forEach((row, y) => { if (row.length !== W) mapBad.push(`${id}: ${y} 行目の幅が ${row.length}（期待 ${W}）`); });
      [...m.grid.join('')].forEach(ch => { if (!Sprites.TILE_IDS.includes(ch)) mapBad.push(`${id}: 未定義のタイル ${ch}`); });
      for (const e of m.events) {
        if (!(m.grid[e.y] && m.grid[e.y][e.x])) mapBad.push(`${id}: イベント (${e.x},${e.y}) がマップ外`);
        for (const f of flagSets) {
          const sc = typeof e.scene === 'function' ? e.scene(f) : e.scene;
          if (sc && !sceneIds.has(sc)) mapBad.push(`${id}: 台本 ${sc} がない`);
        }
        if (e.warp && !Maps.MAPS[e.warp.map]) mapBad.push(`${id}: ワープ先 ${e.warp.map} がない`);
        if (e.warp) { const t = Maps.MAPS[e.warp.map].grid[e.warp.y][e.warp.x]; if (Sprites.SOLID.has(t)) mapBad.push(`${id}: ワープ先 (${e.warp.x},${e.warp.y}) が壁`); }
        if (e.on === 'step' && Sprites.SOLID.has(m.grid[e.y][e.x]) && !(m.passable && m.passable[m.grid[e.y][e.x]])) mapBad.push(`${id}: 踏むイベント (${e.x},${e.y}) が壁の上`);
      }
      for (const oe of [].concat(m.onEnter || [])) if (!sceneIds.has(oe.scene)) mapBad.push(`${id}: onEnter の台本 ${oe.scene} がない`);
      for (const e of m.events) for (const f of flagSets) {
        const sp = typeof e.sprite === 'function' ? e.sprite(f) : e.sprite;
        if (sp && !Sprites.CHAR_IDS.includes(sp)) mapBad.push(`${id}: キャラ ${sp} の絵がない`);
      }
    }
    check('マップの形・タイル・イベントの参照先', !mapBad.length, mapBad.join('\n'));
    const scBad = [];
    for (const [id, steps] of Object.entries(Story.SCENES)) for (const st of steps) {
      if (st.do === 'battle' && !GameData.ENEMIES[st.e]) scBad.push(`${id}: 敵 ${st.e} がない`);
      if (st.do === 'choice') for (const o of st.opts) if (o.go && !Story.SCENES[o.go]) scBad.push(`${id}: 選択肢の先 ${o.go} がない`);
      if (st.do === 'warp') { const m = Maps.MAPS[st.map]; if (!m) scBad.push(`${id}: ワープ先 ${st.map} がない`); else if (Sprites.SOLID.has(m.grid[st.y][st.x])) scBad.push(`${id}: ワープ先 (${st.x},${st.y}) が壁`); }
      if (!st.do && !st.t) scBad.push(`${id}: 台詞が空`);
      if (st.need && !GameData.COMPANIONS.some(c => c.id === st.need)) scBad.push(`${id}: need の仲間 ${st.need} がいない`);
      if (st.do === 'choice') for (const o of st.opts) if (o.shop && !(o.shop.name && o.shop.line)) scBad.push(`${id}: 売店の名前か台詞がない`);
    }
    for (const [k, E] of Object.entries(GameData.ENEMIES)) {
      const ids = [E.sprite, ...(E.phases || []).map(p => p.transform), ...Object.values(E.forms || {}).map(f => f.sprite)].filter(Boolean);
      for (const sp of ids) if (!Sprites.CHAR_IDS.includes(sp)) scBad.push(`敵 ${k} の絵 ${sp} がない`);
    }
    // BGM: 主旋律とベースの長さがそろっている（ずれずに繰り返す）
    for (const [k, tr] of Object.entries(Sound.TRACKS)) if (tr.lead.length !== tr.bass.length) scBad.push(`BGM ${k}: 主旋律 ${tr.lead.length} / ベース ${tr.bass.length}`);
    for (const m of Object.values(Maps.MAPS)) if (typeof m.bgm === 'string' && !Sound.TRACKS[m.bgm]) scBad.push(`BGM ${m.bgm} がない`);
    for (const k of GameData.RANDOM_ENEMIES) if (!GameData.ENEMIES[k]) scBad.push(`ランダム敵 ${k} がない`);
    for (const [id, m] of Object.entries(Maps.MAPS)) for (const k of (m.encounters && m.encounters.enemies) || []) if (!GameData.ENEMIES[k]) scBad.push(`${id} のエンカウント敵 ${k} がない`);
    // 話しかけるイベントは、となりのどこかに歩ける場所がある（囲まれて届かない人がいない）
    for (const [id, m] of Object.entries(Maps.MAPS)) for (const e of m.events) {
      if (e.on !== 'bump') continue;
      const open = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const r = m.grid[e.y + dy]; return r && r[e.x + dx] && !Sprites.SOLID.has(r[e.x + dx]); });
      if (!open) scBad.push(`${id}: ${e.sprite || 'イベント'} (${e.x},${e.y}) のまわりに歩ける場所がない`);
    }
    check('台本の参照先（敵・台詞）', !scBad.length, scBad.join('\n'));

    // ---- 話している人の顔：台本の話者に、顔の絵が決まっている ----
    const faceBad = [], compNames = GameData.COMPANIONS.map(c => c.name);
    for (const [id, steps] of Object.entries(Story.SCENES)) for (const st of steps) {
      if (!st.w || st.w.startsWith('@') || st.w === 'カーボ' || compNames.includes(st.w)) continue;
      if (!Story.FACES[st.w]) faceBad.push(`${id}: 話者「${st.w}」の顔がない`);
    }
    for (const [w, v] of Object.entries(Story.FACES)) for (const f of flagSets) {
      const sp = typeof v === 'function' ? v(f) : v;
      if (!Sprites.CHAR_IDS.includes(sp)) faceBad.push(`${w}: 顔の絵 ${sp} がない`);
    }
    check('話している人の顔', !faceBad.length, [...new Set(faceBad)].join('\n'));
    // バトル中のセリフ（形態変化など）の話者にも、顔がある（いま戦っている相手、カーボ、FACES のどれか）
    const base = n => n.replace(/（.*）$/, ''), talkBad = [];
    for (const [k, E] of Object.entries(GameData.ENEMIES)) {
      const names = [E.name, ...(E.phases || []).filter(ph => ph.name).map(ph => ph.name), ...Object.values(E.forms || {}).map(F => F.name)].map(base);
      const lines = [...(E.phases || []).flatMap(ph => ph.text.split('\n')), ...Object.values(E.forms || {}).map(F => `${F.name}「${F.into}」`)];
      for (const l of lines) {
        if (l.startsWith('（') || l.trim() === '---') continue;
        const m = l.match(/^([^「]+)「[\s\S]*」$/);
        if (!m) { talkBad.push(`${k}: 「${l}」が話者とセリフに分けられない`); continue; }
        const w = m[1];
        if (w !== 'カーボ' && !names.includes(base(w)) && !Story.FACES[w] && !Story.FACES[base(w)]) talkBad.push(`${k}: 話者「${w}」の顔がない`);
      }
    }
    check('バトル中のセリフの話者と顔', !talkBad.length, talkBad.join('\n'));

    // ---- 仲間：CIP 順位が重ならない（R/S が決まる）、技の種類がバトルで扱える、売店だけの仲間は高い ----
    const compBad = [], SKILLS = ['heal', 'power', 'stink', 'fifty', 'time', 'guard', 'retry', 'drain'];
    const ranks = GameData.COMPANIONS.map(c => c.rank.join(','));
    if (new Set(ranks).size !== ranks.length) compBad.push(`CIP 順位が重なっている: ${ranks.join(' / ')}`);
    for (const c of GameData.COMPANIONS) {
      if (!SKILLS.includes(c.skill.id)) compBad.push(`${c.name}: 技 ${c.skill.id} をバトルで扱えない`);
      if (c.skill.lv.length !== GameData.SKILL_MAX || c.skill.lv.some(l => !l.desc || !(l.uses > 0))) compBad.push(`${c.name}: 技のレベルの書き方`);
      if (c.price && !(c.price > GameData.COMP_PRICE)) compBad.push(`${c.name}: 売店だけの仲間なのに、ふつうの紹介料より安い`);
    }
    if (GameData.COMPANIONS.filter(c => !c.price).length < 4) compBad.push('最初に選べる仲間が 4 人未満');
    check(`仲間の順位・技・値段（${GameData.COMPANIONS.length} 人）`, !compBad.length, compBad.join('\n'));

    // ---- いまの目的：物語の順にフラグを立てても、クリアまで目的が途切れず、印の場所がマップの中にある ----
    const goalOrder = ['started', 'elder', 'f_entry', 'sisters', 'duo', 'boss', 'clear', 'c2_arrive', 'c2_met', 'c2_lens', 'c2_pier', 'c2_kidnap', 'c2_rescued',
      'c2_clue2', 'c2_clue3', 'c2_chase', 'c2_reveal', ...c3Order, ...c4Order, ...c5Order];
    const goalBad = [];
    goalOrder.forEach((k, i) => {
      const base = Object.fromEntries(goalOrder.slice(0, i + 1).map(x => [x, true]));
      for (const night of [false, true]) {
        const g = Maps.goalOf({ ...base, night });
        if (k === 'c3_boss' || k === 'c4_boss' || k === 'c5_boss') { if (g) goalBad.push(`${k} のあとにも目的が残っている`); continue; }
        if (!g || !g.t) { goalBad.push(`${k} のあとに目的がない`); continue; }
        if (!g.to.length) goalBad.push(`${k}: 目的の場所 to がない`);
        for (const [mp, x, y] of [...g.at, ...g.to]) { const m = Maps.MAPS[mp]; if (!m || !(m.grid[y] && m.grid[y][x])) goalBad.push(`${k}: 印 ${mp} (${x},${y}) がマップ外`); }
      }
    });
    // 第 3 章のあいだに港へ戻ったら、船で王国へ戻る案内になる
    const midC3 = Object.fromEntries(goalOrder.slice(0, goalOrder.indexOf('c3_mid')).map(x => [x, true]));
    for (const here of ['port', 'town', 'lab']) { const g = Maps.goalOf(midC3, here); if (!g || g.at[0][0] !== 'port') goalBad.push(`第 3 章で ${here} にいるとき、船の案内がない`); }
    if (Maps.goalOf(midC3, 'capital').t !== Maps.goalOf(midC3).t) goalBad.push('王都の中で、船の案内が出てしまう');
    // 前の章の記録が欠けたセーブでも、前の章の目的に戻らない
    for (const [fl, want] of [[{ started: true, clear4: true, ch5: true }, '地下'], [{ started: true, clear3: true, ch4: true }, '山道'], [{ started: true, ch3: true }, '城門'], [{ started: true, clear: true, ch2: true }, 'カルボニル港']]) {
      const g = Maps.goalOf(fl);
      if (!g || !g.t.includes(want)) goalBad.push(`${Object.keys(fl).join(',')} のとき、目的が「${g && g.t}」（期待：${want}）`);
    }
    check('いまの目的が物語の最後まで途切れない', !goalBad.length, goalBad.join('\n'));

    // ---- 開発者メニュー：章のはじめの状態のフラグが、物語のどこかで立つものか。前の章の目的が出ないか ----
    const devBad = [], setFlags = new Set(['started']);
    for (const steps of Object.values(Story.SCENES)) for (const st of steps) if (st.do === 'flag') setFlags.add(st.f);
    for (const m of Object.values(Maps.MAPS)) {
      for (const o of [].concat(m.onEnter || [])) setFlags.add(o.flag);
      for (const r of (m.mirror && m.mirror.rooms) || []) setFlags.add(r[2]);   // 鏡の広間の部屋
    }
    for (const L of Maps.EXTRACT.locks) setFlags.add(L.flag);                   // 分液区の扉
    for (const id of Object.keys(Maps.EXTRACT.residents)) setFlags.add('c5t_' + id);   // 分液区の住人と話した
    for (const [ch, fs] of Object.entries(DevStart.flags)) {
      for (const f of fs) if (!setFlags.has(f) && !/^(clear\d?|ch\d)$/.test(f)) devBad.push(`第 ${ch} 章の ${f} は、どこでも立たない`);
      if (!fs.includes(ch === '1' ? 'clear' : `clear${ch}`)) devBad.push(`第 ${ch} 章のフラグに clear がない`);
      if (!DevStart.lv[ch] || DevStart.money[ch] == null) devBad.push(`第 ${ch} 章のレベルか研究費がない`);
    }
    for (let n = 2; n <= 6; n++) {
      const fl = Object.fromEntries(Object.entries(DevStart.flags).filter(([c]) => +c < n).flatMap(([, fs]) => fs.map(f => [f, true])));
      const g = Maps.goalOf(fl);
      if (n === 6 ? g : !g) devBad.push(`第 ${n} 章のはじめの目的が「${g && g.t}」`);
    }
    check('開発者メニューで選べる章のはじめの状態', !devBad.length, devBad.join('\n'));

    // ---- 鏡の広間：どの部屋も、カーボと影が同時にスイッチを踏めるように解ける ----
    const mirBad = [];
    const MH = Maps.MAPS.mhall, ax = MH.mirror.axis, cell = (x, y) => (MH.grid[y] && MH.grid[y][x]) || 'C';
    MH.mirror.rooms.forEach(([a, b], k) => {
      const open = (x, y) => y >= a && y <= b && (cell(x, y) === '%' || cell(x, y) === '$');
      const sx0 = MH.mirror.startX, p0 = [sx0, b], s0 = [2 * ax - sx0, b], key = (p, q) => p.join() + '|' + q.join();
      const seen = new Set([key(p0, s0)]), qu = [[p0, s0, 0]];
      let found = null;
      while (qu.length && found === null) {
        const [p, q, n] = qu.shift();
        if (cell(...p) === '$' && cell(...q) === '$') { found = n; break; }
        for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
          const np = [p[0] + dx, p[1] + dy];
          if (!(np[0] < ax && open(...np))) continue;
          const nq = open(q[0] - dx, q[1] + dy) && q[0] - dx > ax ? [q[0] - dx, q[1] + dy] : q;
          const kk = key(np, nq); if (!seen.has(kk)) { seen.add(kk); qu.push([np, nq, n + 1]); }
        }
      }
      if (found === null) mirBad.push(`部屋 ${k + 1} が解けない`);
      else if (found < 4) mirBad.push(`部屋 ${k + 1} が簡単すぎる（${found} 手）`);
    });
    check('鏡の広間の 3 つの部屋が、どれも解ける', !mirBad.length, mirBad.join('\n'));

    // ---- 物語の出来事を、踏まずに回りこめない（奥の院の見張り、回廊のテンポの話、王都のラジカとの出会い） ----
    const gateBad = [];
    const mustStep = (mapId, from, to, flags, why) => {
      const m = Maps.MAPS[mapId], ok = (x, y) => m.grid[y] && m.grid[y][x] && !Sprites.SOLID.has(m.grid[y][x]);
      const trig = (x, y) => m.events.some(e => e.x === x && e.y === y && e.on === 'step' && e.scene && (!e.when || e.when(flags)));
      const blocked = (x, y) => m.events.some(e => e.x === x && e.y === y && e.on === 'bump' && (!e.when || e.when(flags)));
      const seen = new Set([from.join()]), q = [from];
      while (q.length) {
        const [x, y] = q.shift();
        if (Math.abs(x - to[0]) + Math.abs(y - to[1]) === 1) { gateBad.push(`${mapId}: ${why}を踏まずに (${to}) まで行ける`); return; }
        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
          const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
          if (seen.has(k) || !ok(nx, ny) || trig(nx, ny) || blocked(nx, ny)) continue;
          seen.add(k); q.push([nx, ny]);
        }
      }
    };
    const fC4 = Object.fromEntries(['clear3', 'ch4', 'c4_wed'].map(k => [k, true]));
    mustStep('oku', [7, 18], [7, 4], fC4, '奥の院の見張りの場面');
    mustStep('kairo', [6, 11], [6, 1], { ...fC4, c4_door1: true, c4_door2: true, c4_door3: true, c4_door4: true }, 'テンポの話');
    mustStep('capital', [16, 27], [16, 13], { c3_king1: true }, 'ラジカとの出会い');
    const fC5 = Object.fromEntries(c5Order.slice(0, c5Order.indexOf('c5_tppo') + 1).map(k => [k, true]));
    mustStep('hiroba', [7, 1], [7, 10], fC5, 'カチオーネとの戦い');
    mustStep('hannou', [7, 1], [7, 6], { ...fC5, c5_cation: true, c5_star: true, c5_starGone: true }, 'ボーカとの戦い');
    mustStep('bridge5', [7, 1], [7, 10], { ch5: true }, '配管橋の待ち伏せ');
    check('物語の出来事を、踏まずに回りこめない', !gateBad.length, gateBad.join('\n'));

    // ---- マップの端から出たら、次のマップの反対側の端に着く（右から出て右から入る、のようにならない） ----
    const edgeBad = [], OPP = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' };
    const edgeOf = (m, x, y, w) => { const H = m.grid.length, W = m.grid[0].length; return y <= w ? 'top' : y >= H - 1 - w ? 'bottom' : x <= w ? 'left' : x >= W - 1 - w ? 'right' : null; };
    for (const [id, m] of Object.entries(Maps.MAPS)) for (const e of m.events || []) {
      const to = e.warp && Maps.MAPS[e.warp.map]; if (!to) continue;
      const a = edgeOf(m, e.x, e.y, 0), b = a && edgeOf(to, e.warp.x, e.warp.y, 1);
      if (b && b !== OPP[a]) edgeBad.push(`${id} (${e.x},${e.y}) の${a}から出ると、${e.warp.map} の${b}に着く`);
    }
    check('マップの端から出ると、次のマップの反対側に着く', !edgeBad.length, edgeBad.join('\n'));

    // ---- 人が、細い道をふさがない（各章のはじめとその後の世界で、入り口から行ける場所が、人のせいで減らない） ----
    // 婚礼の広間は、式の参列者が道をふさぐ場面なので除く。宝箱・扉・看板などの物は数えない
    const blockBad = [], OBJ = /^(chest|rotDoor|sign|pillar|lamp|pump|ladder|lock|boat|ship|mol|brineTap)/;
    for (let n = 2; n <= 6; n++) {
      const f = Object.fromEntries(Object.entries(DevStart.flags).filter(([c]) => +c < n).flatMap(([, fs]) => fs.map(k => [k, true])));
      for (const [id, m] of Object.entries(Maps.MAPS)) {
        if (m.layer || m.mirror || id === 'chapel') continue;
        const pass = (x, y) => { const ch = m.grid[y] && m.grid[y][x]; if (!ch) return false; return m.passable && m.passable[ch] ? m.passable[ch](f) : !Sprites.SOLID.has(ch); };
        const act = (m.events || []).filter(e => !e.when || e.when(f)), spr = e => (typeof e.sprite === 'function' ? e.sprite(f) : e.sprite);
        const people = act.filter(e => e.on === 'bump' && e.sprite && !OBJ.test(spr(e) || ''));
        const npc = new Set(people.map(e => e.x + ',' + e.y)), obj = new Set(act.filter(e => e.on === 'bump' && !npc.has(e.x + ',' + e.y)).map(e => e.x + ',' + e.y));
        for (const [sid, m2] of Object.entries(Maps.MAPS)) for (const w of m2.events || []) {
          if (!w.warp || w.warp.map !== id || (w.when && !w.when(f))) continue;
          const s = [w.warp.x, w.warp.y];
          const bfs = withNpc => { const seen = new Set([s.join()]), q = [s];
            while (q.length) { const [x, y] = q.shift(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy, k = nx + ',' + ny; if (seen.has(k) || !pass(nx, ny) || obj.has(k) || (withNpc && npc.has(k))) continue; seen.add(k); q.push([nx, ny]); } }
            return seen; };
          const a = bfs(true), b = bfs(false), lost = [...b].filter(k => !a.has(k) && !npc.has(k));
          if (lost.length > 2) blockBad.push(`${n === 6 ? 'その後の世界' : `第 ${n} 章のはじめ`}：${id}（${sid} から）で ${lost.length} マス行けない（${people.filter(e => b.has(e.x + ',' + e.y)).map(e => `${spr(e)} (${e.x},${e.y})`).join('・')}）`);
        }
      }
    }
    check('人が、細い道をふさがない', !blockBad.length, [...new Set(blockBad)].join('\n'));

    // ---- 村・森・港の住人は、章が進むと台詞が変わる（第 1 章の台詞のまま、第 4 章まで残らない） ----
    const later = { boss: true, elder: true, clear: true, ch2: true, c2_met: true, c2_reveal: true, c2_kidnap: true, c2_rescued: true, c2_boss: true };
    const stageFlags = [later, { ...later, ch3: true, c3_boss: true, clear3: true, ch4: true }, { ...later, ch3: true, c3_boss: true, clear3: true, ch4: true, c4_boss: true }];
    const npcBad = [];
    for (const [mid, sp] of [['town', 'water'], ['town', 'methane'], ['town', 'guard'], ['forest', 'lumber'], ['forest', 'victim'], ['forest', 'carvoneR'], ['port', 'kidA'], ['port', 'director'], ['port', 'menthone'], ['port', 'methylBoss'], ['port', 'granny'], ['port', 'twins']]) {
      const e = Maps.MAPS[mid].events.find(x => x.sprite === sp && typeof x.scene === 'function' && (!x.when || x.when(later)));
      const ids = stageFlags.map(f => e.scene(f));
      ids.forEach(id => { if (!Story.SCENES[id]) npcBad.push(`${mid} の ${sp}: 台本 ${id} がない`); });
      if (ids[0] === ids[1]) npcBad.push(`${mid} の ${sp}: 第 3 章のあとも、前と同じ台詞（${ids[0]}）`);
    }
    check('村・森・港の住人の台詞が、章ごとに変わる', !npcBad.length, npcBad.join('\n'));

    // ---- 同じ人が、同時に 2 か所にいない（物語の順にフラグを立てて、行けるマップどうしを比べる） ----
    // 行けるマップ：その章のマップ。入ったときにフラグが立つマップは、そのフラグのあとから
    const SAME = { elderCl: 'elder', naphthaNoCrown: 'naphtha', ketoh: 'enolas', thief: 'enolas', ketohNoMono: 'enolas', achiral: 'akiral', achiralOpen: 'akiral', radika3: 'radika', bull0: 'bull', bull1: 'bull', bull2: 'bull' };
    const MANY = new Set(['sign', 'chest', 'victim', 'meso', 'bht', 'guard', 'lamp', 'pumpAcid', 'pumpBase', 'pumpBicarb', 'ladder', 'ladderFoam', 'brineTap', 'pillarOn', 'pillarOff']);
    const OK2 = new Set([
      'granny:capital,port', 'granny:capital,cellar,port', 'prof:capital,lab', 'innkeeper:capital,port', // 別の人（フェノール婆さん・工房の弟子・王都の宿の主人）
      'grignard:port,shore',                                    // 船頭。乗らないと反対の岸は見えない
    ]);
    const twoBad = new Set(); let chNow = 1; const fNow = {};
    const chOf = id => Maps.MAPS[id].ch || 1, enterFlag = id => Maps.MAPS[id].onEnter && Maps.MAPS[id].onEnter.flag;
    for (const k of [...goalOrder.flatMap(k => /^clear\d?$/.test(k) ? [k, 'ch' + (k === 'clear' ? 2 : +k.slice(5) + 1)] : k === 'c5_star' ? [k, 'c5_starGone'] : [k]), 'c5_boss', 'clear5', 'ch6']) {
      fNow[k] = true; const mm = /^ch(\d)$/.exec(k); if (mm) chNow = Math.max(chNow, +mm[1]);
      const where = {};
      for (const [id, m] of Object.entries(Maps.MAPS)) {
        if (chOf(id) > chNow || (enterFlag(id) && !fNow[enterFlag(id)] && chOf(id) === chNow)) continue;
        for (const e of m.events || []) {
          if (!e.sprite || (e.when && !e.when(fNow))) continue;
          let sp = typeof e.sprite === 'function' ? e.sprite(fNow) : e.sprite;
          if (typeof sp !== 'string' || MANY.has(sp)) continue; sp = SAME[sp] || sp;
          (where[sp] = where[sp] || new Set()).add(id);
        }
      }
      for (const [sp, ids] of Object.entries(where)) { const key = sp + ':' + [...ids].sort().join(','); if (ids.size > 1 && !OK2.has(key)) twoBad.add(`${key}（${k} のあと）`); }
    }
    check('同じ人が、同時に 2 か所にいない', !twoBad.size, [...twoBad].join('\n'));

    // ---- 第 5 章：分液区の 3 つの部屋が、どれも解ける（pH の決まりと、扉の前に鍵の住人を立たせられること） ----
    const X = Maps.EXTRACT, exBad = [];
    const L = { amine: [], acid: [], phenol: [] };
    for (const ph of ['neutral', 'acid', 'bicarb', 'base']) for (const t of Object.keys(L)) L[t].push(X.layerFor(t, ph));
    if (L.amine.join() !== 'org,aq,org,org') exBad.push(`アミンの層: ${L.amine}`);
    if (L.acid.join() !== 'org,org,aq,aq') exBad.push(`カルボン酸の層: ${L.acid}`);
    if (L.phenol.join() !== 'org,org,org,aq') exBad.push(`フェノールの層: ${L.phenol}`);
    const grid = layer => Maps.MAPS[X.maps[layer]].grid;
    const floor = (layer, x, y) => grid(layer)[y] && grid(layer)[y][x] && !Sprites.SOLID.has(grid(layer)[y][x]);
    const evAt = (layer, x, y) => Maps.MAPS[X.maps[layer]].events.some(e => e.x === x && e.y === y && e.on === 'bump');
    const free = (layer, x, y) => floor(layer, x, y) && !evAt(layer, x, y);
    for (const [id, r] of Object.entries(X.residents)) if (!free('org', ...r.at)) exBad.push(`${id} のはじめの場所が、有機層で歩けない`);
    for (const lk of X.locks) if (!free(lk.layer, ...lk.front)) exBad.push(`${lk.flag} の扉の前が、歩けない`);
    const st = X.init(), at = (id, x, y) => Object.assign(st.res[id], { x, y });
    // 部屋 1：弟を扉の真上（有機層）へ連れて行き、酸
    at('amS', ...X.locks[0].front); X.applyPh(st, 1, 'acid', free);
    if (st.res.amS.layer !== 'aq') exBad.push('部屋 1：酸で弟が水層へ下りない');
    // 部屋 2：クレゾールは扉の前（有機層）から動かない。NaOH では扉の前（水層）に下りてふさぐ。重曹に替えると、クレゾールだけ上がる
    if (!X.residents.cres.fixed || X.residents.cres.at.join() !== X.locks[1].front.join()) exBad.push('部屋 2：クレゾールが、扉の真上で動かない人になっていない');
    X.applyPh(st, 2, 'base', free);
    if (st.res.cres.layer !== 'aq' || st.res.ibu.layer !== 'aq') exBad.push('部屋 2：NaOH で 2 人とも水層へ下りない');
    X.applyPh(st, 2, 'bicarb', free);
    if (st.res.cres.layer !== 'org' || st.res.ibu.layer !== 'aq') exBad.push('部屋 2：重曹で、クレゾールだけが上がらない');
    // 部屋 3：塩基で番人を水層へ。姉を扉の真上へ。酸で 2 人が同じ場所で入れ替わる
    X.applyPh(st, 3, 'base', free);
    if (st.res.mand.layer !== 'aq') exBad.push('部屋 3：塩基で番人が水層へ下りない');
    at('amR', ...X.locks[2].front); X.applyPh(st, 3, 'acid', free);
    if (st.res.amR.layer !== 'aq' || st.res.mand.layer !== 'org') exBad.push('部屋 3：酸で、姉と番人が入れ替わらない');
    // 部屋 3：水層の扉の前は、まわりが壁の小部屋（上の層から下りるしかない）。扉の反対側と左右が壁
    const [px, py] = X.locks[2].front, back = 2 * py - X.locks[2].at[1];
    if ([[px - 1, py], [px + 1, py], [px, back]].some(([x, y]) => floor('aq', x, y))) exBad.push('部屋 3：扉の前（水層）に、横か後ろから歩いて入れる');
    // 壁の下へは移らない（部屋 3 の水層は、扉の手前の行が壁）
    const st2 = X.init(); st2.res.amR.x = 5; st2.res.amR.y = 12; X.applyPh(st2, 3, 'acid', free);
    if (st2.res.amR.layer !== 'org') exBad.push('壁の下へ移ってしまう');
    // カーボが、両方の層で、部屋の中を歩いて扉の前・はしごの横・ポンプの横まで行ける
    for (const layer of ['org', 'aq']) for (const r of X.rooms) {
      const cells = []; for (let y = r.y0; y <= r.y1; y++) for (let x = 1; x <= 13; x++) if (free(layer, x, y)) cells.push([x, y]);
      const seen = new Set([cells[0].join()]), q = [cells[0]];
      while (q.length) { const [x, y] = q.shift(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = [x + dx, y + dy]; if (y + dy < r.y0 || y + dy > r.y1) continue; if (free(layer, ...k) && !seen.has(k.join())) { seen.add(k.join()); q.push(k); } } }
      // 部屋 3 の水層の小部屋（扉の前）だけは、歩いては行けない
      const pocket = layer === 'aq' && r.id === 3 ? 1 : 0;
      if (seen.size !== cells.length - pocket) exBad.push(`${layer} の部屋 ${r.id} に、歩いて行けない場所がある（${cells.length - seen.size} マス）`);
    }
    check('分液区の 3 つの部屋が、どれも解ける', !exBad.length, exBad.join('\n'));

    // ---- 構造式の E/Z が、SMILES のとおりに描かれる（SmilesDrawer は共役ジエンで描き違えるので、Mol が直している） ----
    // 期待値は RDKit で作った表：[二重結合の原子 a, b, a の隣, b の隣, 'cis'|'trans']。E/Z のある SMILES を足したら表も足す
    const EZ = {
      "Br/C(=C/c2ccccc2)c1ccccc1": [[1, 2, 0, 3, "trans"]],
      "Br/C(=C\\c2ccccc2)c1ccccc1": [[1, 2, 0, 3, "cis"]],
      "C/C=C/C": [[1, 2, 0, 3, "trans"]],
      "C/C=C/C=C/C": [[1, 2, 0, 3, "trans"], [3, 4, 2, 5, "trans"]],
      "C/C=C/C=C\\C": [[1, 2, 0, 3, "trans"], [3, 4, 2, 5, "cis"]],
      "C/C=C/C=C\\C=C\\C": [[1, 2, 0, 3, "trans"], [3, 4, 2, 5, "cis"], [5, 6, 4, 7, "trans"]],
      "C/C=C/C=O": [[1, 2, 0, 3, "trans"]],
      "C/C=C/CC/C=C\\C": [[1, 2, 0, 3, "trans"], [5, 6, 4, 7, "cis"]],
      "C/C=C/CCC": [[1, 2, 0, 3, "trans"]],
      "C/C=C\\C": [[1, 2, 0, 3, "cis"]],
      "C/C=C\\C=C/C": [[1, 2, 0, 3, "cis"], [3, 4, 2, 5, "cis"]],
      "C/C=C\\CCC": [[1, 2, 0, 3, "cis"]],
      "CC(C)(C#N)/N=N/C(C)(C)C#N": [[5, 6, 1, 7, "trans"]],
      "CCCCC/C=C\\C/C=C\\CCCCCCCC(=O)O": [[5, 6, 4, 7, "cis"], [8, 9, 7, 10, "cis"]],
      "CCOC(=O)/C=C/c1ccccc1": [[5, 6, 3, 7, "trans"]],
      "CO/C=C/C(=C)O[Si](C)(C)C": [[2, 3, 1, 4, "trans"]],
      "COC(=O)/C=C\\C(=O)OC": [[4, 5, 2, 6, "cis"]],
      "Cl/C=C/Cl": [[1, 2, 0, 3, "trans"]],
      "O=C(/C=C/c1ccccc1)/C=C/c1ccccc1": [[2, 3, 1, 4, "trans"], [10, 11, 1, 12, "trans"]],
      "O=C(O)/C=C/c1ccccc1": [[3, 4, 1, 5, "trans"]],
      "c1ccc(/N=N/c2ccccc2)cc1": [[4, 5, 3, 6, "trans"]],
      "c1ccc(cc1)/C=C/c1ccccc1": [[6, 7, 3, 8, "trans"]],
      "c1ccc(cc1)/C=C\\c1ccccc1": [[6, 7, 3, 8, "cis"]]
    };
    const ezBad = [], ezSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(ezSvg);
    const ezSmiles = new Set(Questions.LIST.flatMap(q => [...(q.cs || []), ...(q.mols || []).map(m => m[1])]).filter(x => x && /[\/\\]/.test(x)));
    for (const smi of ezSmiles) {
      if (!EZ[smi]) { ezBad.push(`${smi}: 期待値の表にない`); continue; }
      SmilesDrawer.parse(smi, tree => {
        const dr = Mol.newDrawer({ width: 200, height: 140, padding: 6, bondLength: 22, compactDrawing: false, themes: { dq: {} } });
        dr.draw(tree, ezSvg, 'dq');
        const P = dr.preprocessor.graph.vertices.map(v => v.position);
        for (const [a, b, n1, n2, want] of EZ[smi]) {
          const side = i => Math.sign((P[b].x - P[a].x) * (P[i].y - P[a].y) - (P[b].y - P[a].y) * (P[i].x - P[a].x));
          const got = side(n1) === side(n2) ? 'cis' : 'trans';
          if (got !== want) ezBad.push(`${smi}: ${a}=${b} が ${want} のはずが ${got} に描かれる`);
        }
      }, () => ezBad.push(`${smi}: 読めない`));
    }
    ezSvg.remove();
    check(`構造式の E/Z が正しく描かれる（${ezSmiles.size} 個）`, !ezBad.length, ezBad.join('\n'));

    // ---- 立体中心の R/S：描いた位置とくさびから R/S を求め、RDKit の値と比べる（SmilesDrawer は R/S を描き違えることがある） ----
    // 表：SMILES → [重原子の番号, 隣の原子を CIP の高い順に（-1 は H）, R/S]。
    // 環の cis/trans など R/S の付かない立体（表が空）は、SMILES の @ / @@ と描いた形を Mol.stereoCheck で比べる
    const RS = {
      'Br[C@H](c1ccccc1)[C@@H](Br)c1ccccc1': [[1, [0, 8, 2, -1], 'R'], [8, [9, 1, 10, -1], 'S']],
      'C=C[C@@H](C)[C@@H](C)C=C': [[2, [4, 1, 3, -1], 'R'], [4, [2, 6, 5, -1], 'S']],
      'CC(=O)O[C@@H](C)[C@@H](C)c1ccccc1': [[4, [3, 6, 5, -1], 'S'], [6, [4, 8, 7, -1], 'S']],
      'CC(=O)O[C@@H](C)[C@H](C)c1ccccc1': [[4, [3, 6, 5, -1], 'S'], [6, [4, 8, 7, -1], 'R']],
      'CC(=O)O[C@@H]1C=C[C@H](OC(C)=O)C1': [[4, [3, 5, 12, -1], 'S'], [7, [8, 6, 12, -1], 'R']],
      'CC(=O)O[C@@H]1CCCC[C@H]1OC(C)=O': [[4, [3, 9, 5, -1], 'R'], [9, [10, 4, 8, -1], 'R']],
      'CC(=O)O[C@@H]1CCCC[C@H]1OS(=O)(=O)c1ccc(C)cc1': [[4, [3, 9, 5, -1], 'R'], [9, [10, 4, 8, -1], 'R']],
      'CC(=O)O[C@@H]1C[C@@H]2CC[C@H]1C2': [[4, [3, 9, 5, -1], 'R'], [6, [5, 10, 7, -1], 'R'], [9, [4, 10, 8, -1], 'S']],
      'CC(=O)O[C@H]1CCCC[C@H]1OC(C)=O': [[4, [3, 9, 5, -1], 'S'], [9, [10, 4, 8, -1], 'R']],
      'CC(=O)O[C@H]1C[C@@H]2CC[C@H]1C2': [[4, [3, 9, 5, -1], 'S'], [6, [5, 10, 7, -1], 'R'], [9, [4, 10, 8, -1], 'S']],
      'CC(C)(C)[C@H]1CC[C@@H](Cl)CC1': [],
      'CC(C)(C)[C@H]1CC[C@H](Cl)CC1': [],
      'CC(C)[C@@H]1CC[C@@H](C)C[C@H]1Cl': [[3, [9, 1, 4, -1], 'S'], [6, [8, 5, 7, -1], 'R'], [9, [10, 3, 8, -1], 'R']],
      'CC(C)[C@@H]1CC[C@@H](C)C[C@H]1O': [[3, [9, 1, 4, -1], 'S'], [6, [8, 5, 7, -1], 'R'], [9, [10, 3, 8, -1], 'R']],
      'CCC[C@](C)(Br)CC': [[3, [5, 2, 6, 4], 'R']],
      'CCOC(=O)[C@H](O)[C@@H](O)C(=O)OCC': [[5, [6, 3, 7, -1], 'R'], [7, [8, 9, 5, -1], 'R']],
      'CC[C@@H](Br)[C@@H](C)Br': [[2, [3, 4, 1, -1], 'R'], [4, [6, 2, 5, -1], 'R']],
      'CC[C@@H](C)O': [[2, [4, 1, 3, -1], 'R']],
      'CC[C@H](Br)[C@@H](C)Br': [[2, [3, 4, 1, -1], 'S'], [4, [6, 2, 5, -1], 'R']],
      'CC[C@H](C)O': [[2, [4, 1, 3, -1], 'S']],
      'COC(=O)[C@@H]1CC=CC[C@@H]1C(=O)OC': [[4, [2, 9, 5, -1], 'R'], [9, [10, 4, 8, -1], 'S']],
      'COC(=O)[C@@H]1CC=CC[C@H]1C(=O)OC': [[4, [2, 9, 5, -1], 'R'], [9, [10, 4, 8, -1], 'R']],
      'C[C@@H](Br)CC': [[1, [2, 3, 0, -1], 'R']],
      'C[C@@H](Br)[C@@H](Br)C': [[1, [2, 3, 0, -1], 'R'], [3, [4, 1, 5, -1], 'S']],
      'C[C@@H](Br)[C@H](Br)C': [[1, [2, 3, 0, -1], 'R'], [3, [4, 1, 5, -1], 'R']],
      'C[C@@H](C#N)CC': [[1, [2, 4, 0, -1], 'R']],
      'C[C@@H](N)c1ccccc1': [[1, [2, 3, 0, -1], 'R']],
      'C[C@@H](N=[N+]=[N-])CC': [[1, [2, 5, 0, -1], 'R']],
      'C[C@@H](O)CC': [[1, [2, 3, 0, -1], 'R']],
      'C[C@@H](O)CCCCCC': [[1, [2, 3, 0, -1], 'R']],
      'C[C@@H](O)CO': [[1, [2, 3, 0, -1], 'R']],
      'C[C@@H](O)[C@@H](C)O': [[1, [2, 3, 0, -1], 'R'], [3, [5, 1, 4, -1], 'R']],
      'C[C@@H](O)[C@H](C)O': [[1, [2, 3, 0, -1], 'R'], [3, [5, 1, 4, -1], 'S']],
      'C[C@@H]1C=CC=C[C@@H]1C': [[1, [2, 6, 0, -1], 'S'], [6, [5, 1, 7, -1], 'R']],
      'C[C@@H]1C=CC=C[C@H]1C': [[1, [2, 6, 0, -1], 'S'], [6, [5, 1, 7, -1], 'S']],
      'C[C@@H]1C=C[C@@H]1C': [[1, [2, 4, 0, -1], 'S'], [4, [3, 1, 5, -1], 'R']],
      'C[C@@H]1C=C[C@H]1C': [[1, [2, 4, 0, -1], 'S'], [4, [3, 1, 5, -1], 'S']],
      'C[C@@H]1CCCC[C@H]1C': [[1, [6, 2, 0, -1], 'R'], [6, [1, 5, 7, -1], 'R']],
      'C[C@@H]1C[C@@H]1C': [[1, [3, 2, 0, -1], 'R'], [3, [1, 2, 4, -1], 'S']],
      'C[C@@H]1C[C@H]1C': [[1, [3, 2, 0, -1], 'R'], [3, [1, 2, 4, -1], 'R']],
      'C[C@H](Br)CC': [[1, [2, 3, 0, -1], 'S']],
      'C[C@H](Br)[C@@H](Br)C': [[1, [2, 3, 0, -1], 'S'], [3, [4, 1, 5, -1], 'S']],
      'C[C@H](C#N)CC': [[1, [2, 4, 0, -1], 'S']],
      'C[C@H](N=[N+]=[N-])CC': [[1, [2, 5, 0, -1], 'S']],
      'C[C@H](O)CC': [[1, [2, 3, 0, -1], 'S']],
      'C[C@H](O)CCC': [[1, [2, 3, 0, -1], 'S']],
      'C[C@H](O)CCCCCC': [[1, [2, 3, 0, -1], 'S']],
      'C[C@]12CC[C@H]3[C@@H](CCC4=CC(=O)CC[C@@]43C)[C@@H]1CC[C@@H]2O': [[1, [19, 16, 2, 0], 'S'], [4, [14, 5, 3, -1], 'S'], [5, [16, 4, 6, -1], 'R'], [14, [8, 4, 13, 15], 'R'], [16, [1, 5, 17, -1], 'S'], [19, [20, 1, 18, -1], 'S']],
      'Cc1c(C)c2c(c(C)c1O)CC[C@@](C)(CCC[C@H](C)CCC[C@H](C)CCCC(C)C)O2': [[12, [30, 11, 14, 13], 'R'], [17, [16, 19, 18, -1], 'R'], [22, [21, 24, 23, -1], 'R']],
      'Cc1ccc(S(=O)(=O)O[C@@H](C)[C@H](C)c2ccccc2)cc1': [[9, [8, 11, 10, -1], 'S'], [11, [9, 13, 12, -1], 'R']],
      'Cc1ccc(S(=O)(=O)O[C@@H]2CCCC[C@H]2C)cc1': [[9, [8, 14, 10, -1], 'R'], [14, [9, 13, 15, -1], 'R']],
      'Cc1ccc(S(=O)(=O)O[C@H]2CC[C@@H](C(C)(C)C)CC2)cc1': [],
      'Cc1ccc(S(=O)(=O)O[C@H]2CC[C@H](C(C)(C)C)CC2)cc1': [],
      'O=C(O)[C@@H](O)[C@@H](O)C(=O)O': [[3, [4, 1, 5, -1], 'S'], [5, [6, 7, 3, -1], 'R']],
      'O=C(O)[C@@H](O)[C@H](O)C(=O)O': [[3, [4, 1, 5, -1], 'S'], [5, [6, 7, 3, -1], 'S']],
      'O=C(O)[C@H](O)[C@@H](O)C(=O)O': [[3, [4, 1, 5, -1], 'R'], [5, [6, 7, 3, -1], 'R']],
      'O=C1N[C@@H](Cc2ccccc2)CO1': [[3, [2, 11, 4, -1], 'S']],
      'O=C[C@H](O)CO': [[2, [3, 1, 4, -1], 'R']],
      'O=S(=O)(O[C@H]1C[C@@H]2CC[C@H]1C2)c1ccc(Br)cc1': [[4, [3, 9, 5, -1], 'S'], [6, [5, 10, 7, -1], 'R'], [9, [4, 10, 8, -1], 'S']],
    };
    const rsBad = [], rsSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(rsSvg);
    const rsSmiles = new Set(Questions.LIST.flatMap(q => [q.smiles, ...(q.cs || []), ...(q.cm || []), ...(q.mols || []).map(m => m[1])]).filter(x => x && x.includes('@')));
    let rsN = 0;
    for (const smi of rsSmiles) {
      if (!RS[smi]) { rsBad.push(`${smi}: 期待値の表にない`); continue; }
      SmilesDrawer.parse(smi, tree => {
        const dr = Mol.newDrawer({ width: 200, height: 140, padding: 6, bondLength: 22, compactDrawing: false, themes: { dq: {} } });
        dr.draw(tree, rsSvg, 'dq');
        const g = dr.preprocessor.graph, V = g.vertices, heavy = V.filter(v => v.value.element !== 'H');
        if (!RS[smi].length) {
          const r = Mol.stereoCheck(g); rsN += r.length;
          if (!r.length) rsBad.push(`${smi}: 立体中心が見つからない`);
          r.filter(x => !x.ok).forEach(x => rsBad.push(`${smi}: ${x.v.id} 番の頂点の立体が SMILES と逆に描かれる`));
        }
        for (const [ci, order, want] of RS[smi]) {
          const cv = heavy[ci], P = cv.position, hN = cv.neighbours.find(n => V[n].value.element === 'H');
          const vec = id => { const q = V[id].position, e = g.getEdge(cv.id, id); return [q.x - P.x, P.y - q.y, e && e.wedge ? (e.wedge === 'up' ? 1 : -1) : 0]; };
          const vs = order.map(n => (n === -1 ? (hN != null ? vec(hN) : null) : vec(heavy[n].id)));
          if (!vs[3]) vs[3] = [0, 1, 2].map(k => -(vs[0][k] + vs[1][k] + vs[2][k]));
          const sub = u => u.map((x, k) => x - vs[3][k]), A = sub(vs[0]), B = sub(vs[1]), C = sub(vs[2]);
          const det = A[0] * (B[1] * C[2] - B[2] * C[1]) - A[1] * (B[0] * C[2] - B[2] * C[0]) + A[2] * (B[0] * C[1] - B[1] * C[0]);
          const got = Math.abs(det) < 1e-6 ? '平面' : det < 0 ? 'R' : 'S';
          rsN++; if (got !== want) rsBad.push(`${smi}: ${ci} 番の原子が ${want} のはずが ${got} に描かれる`);
        }
      }, () => rsBad.push(`${smi}: 読めない`));
    }
    rsSvg.remove();
    check(`構造式の R/S が正しく描かれる（${rsSmiles.size} 個、立体中心 ${rsN} か所）`, !rsBad.length, rsBad.join('\n'));

    // ---- 英語の訳 ----
    {
      const EN = I18N.packs.en, tx = EN.text, miss = [], JP = /[぀-ヿ一-鿿]/;
      const need = (s, where) => { if (typeof s === 'string' && JP.test(s) && tx[s] === undefined) miss.push(`${where}: ${s}`); };
      // 「名前「台詞」」の行は、行ごとの訳がなければ、名前と台詞に分けて訳す（game.js の trLine）
      const line = (l, where) => {
        if (tx[l] !== undefined || l.trim() === '---') return;
        const m = !l.startsWith('（') && l.match(/^([^「]+)「([\s\S]*)」$/);
        if (m) { need(m[1], where); need(m[2], where); } else need(l, where);
      };
      const texts = (v, where) => { if (typeof v === 'string') v.split('\n').forEach(l => line(l, where)); else if (Array.isArray(v)) v.forEach(x => texts(x, where)); };
      for (const c of GameData.COMPANIONS) { need(c.name, c.id); need(c.role, c.id); need(c.skill.name, c.id); c.skill.lv.forEach(l => need(l.desc, c.id)); need(c.bond, c.id); }
      for (const [id, it] of Object.entries(GameData.ITEMS)) { need(it.name, id); need(it.desc, id); }
      for (const [k, E] of Object.entries(GameData.ENEMIES)) {
        [E.name, E.start, E.win, ...(E.hit || []), ...(E.miss || []), ...(E.topics || [])].forEach(s => need(s, k));
        (E.phases || []).forEach(p => { texts(p.text, k); need(p.name, k); });
        (E.stages || []).forEach(s => [...(s.hit || []), ...(s.miss || []), ...(s.topics || [])].forEach(x => need(x, k)));
        Object.values(E.forms || {}).forEach(f => [f.name, f.into, ...f.hit, ...f.miss].forEach(x => need(x, k)));
        texts(E.winLines || [], k); if (E.ally) need(E.ally.name, k);
      }
      for (const [id, m] of Object.entries(Maps.MAPS)) {
        need(m.name, id);
        for (const e of m.events || []) if (typeof e.text !== 'function') texts(e.text || [], id);
        for (const o of [m.inspect, m.blockedText]) for (const v of Object.values(o || {})) if (typeof v !== 'function') texts(v, id);
      }
      const X = Maps.EXTRACT;
      Object.values(X.residents).forEach(r => { need(r.name, 'EXTRACT'); need(r.stay, 'EXTRACT'); });
      [...Object.values(X.PH), ...Object.values(X.TYPE)].forEach(s => need(s, 'EXTRACT'));
      Object.keys(Story.FACES).forEach(k => need(k, 'FACES'));
      Questions.LIST.forEach(q => need(q.topic, q.id));
      Questions.DIFFS.slice(1).forEach(d => { need(d.name, 'DIFFS'); need(d.desc, 'DIFFS'); });
      // 台本の話者・選択肢
      for (const [id, sc] of Object.entries(Story.SCENES)) for (const st of sc) {
        if (st.w && !st.w.startsWith('@')) need(st.w, id);
        for (const o of st.opts || []) { need(o.t, id); if (o.shop) { need(o.shop.name, id); need(o.shop.line, id); } }
      }
      check(`英語：名前・敵のセリフ・マップの文字・分野の訳がそろっている`, !miss.length, [...new Set(miss)].join('\n'));

      // {0} {1} の数が、日本語と英語で同じ
      const ph = s => (s.match(/\{\d\}/g) || []).sort().join('');
      const phBad = Object.entries(tx).filter(([k, v]) => ph(k) !== ph(v)).map(([k, v]) => `${k} → ${v}`);
      check('英語：{0} などの埋め込みの数が日本語と同じ', !phBad.length, phBad.join('\n'));

      // 台本：t のある行の数が、日本語の台本と同じ
      const scBad = [];
      for (const [id, lines] of Object.entries(EN.scenes)) {
        if (!Story.SCENES[id]) { scBad.push(`${id}: 日本語の台本にない`); continue; }
        const n = Story.SCENES[id].filter(st => typeof st.t === 'string').length;
        if (n !== lines.length) scBad.push(`${id}: 日本語 ${n} 行 / 英語 ${lines.length} 行`);
        lines.forEach((l, i) => { if (typeof l !== 'string' || !l.trim() || JP.test(l.replace(/〈(自分|逆|脱離)〉/g, ''))) scBad.push(`${id} の ${i + 1} 行目: ${l}`); });
      }
      const nSc = Object.keys(Story.SCENES).length, nEn = Object.keys(EN.scenes).length;
      check(`英語：台本の行の数が日本語と同じ（${nEn}/${nSc} 場面を訳した）`, !scBad.length, scBad.join('\n'));

      // 問題：選択肢・構造式の名前・返事の数が同じ
      const qBad = [];
      for (const [id, e] of Object.entries(EN.q)) {
        const q = Questions.LIST.find(x => x.id === id);
        if (!q) { qBad.push(`${id}: 日本語の問題にない`); continue; }
        if (e.skip) continue;
        if (!e.q || !e.choices || (!e.explain && !q.anyOk)) qBad.push(`${id}: q / choices / explain が足りない`);
        for (const k of ['choices', 'mols', 'replies', 'cl']) if (e[k] && (!q[k] || e[k].length !== q[k].length)) qBad.push(`${id}: ${k} の数が違う`);
        if (e.choices && new Set(e.choices).size !== e.choices.length) qBad.push(`${id}: 選択肢が重複`);
        for (const s of [e.q, e.explain, ...(e.choices || []), ...(e.mols || [])]) if (s && JP.test(s)) qBad.push(`${id}: 日本語が残っている: ${s}`);
        // 文字で答える問題で、正解だけが目立って長くない（長さで正解が分からないように）
        if (e.choices && !q.cs && !q.anyOk) { const L = e.choices.map(c => c.length), mx = Math.max(...L.slice(1)); if (L[0] > mx * 1.3 && L[0] - mx > 15) qBad.push(`${id}: 正解だけが長い（${L[0]} 字 / ほか最長 ${mx} 字）`); }
      }
      const nQ = Questions.LIST.length, nQe = Object.keys(EN.q).length;
      check(`英語：問題の訳の形（${nQe}/${nQ} 問を訳した）`, !qBad.length, qBad.join('\n'));
    }

    out.insertAdjacentHTML('afterbegin', `<h2 class="${fail ? 'ng' : 'ok'}" id="summary">${pass} 件成功 / ${fail} 件失敗</h2>`);
  </script>
</body>
</html>
